name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use supported npm
        run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
